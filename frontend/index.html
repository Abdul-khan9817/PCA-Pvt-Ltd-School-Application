    <!--
      Inline critical CSS: paint a matching background colour immediately so
      the user sees the correct background before the stylesheet loads.
      This also prevents a white flash (FOUC) on slow connections.
    -->
    <style>
      html, body, #root {
        margin: 0;
        padding: 0;
        background: #1e2a4a;
        font-family: Inter, system-ui, -apple-system, sans-serif;
        height: 100%;
        width: 100%;
        overflow: hidden;
      }
      /* Inline loading state so the screen is never blank */
      #root:empty::after {
        content: '';
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

  </body>
